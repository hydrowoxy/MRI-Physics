<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spinor Visualization Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Spinor Visualization</h1>
  </header>
  <main>
    <section id="controls">
      <div class="control-row">
        <button id="addBasis">Add Basis</button>
        <button id="clear">Clear All</button>
      </div>
      <div id="basisList"></div>
      <label>Playback speed
        <select id="playbackRate">
          <option value="1e-12">0.001 ns / second</option>
          <option value="1e-11" selected>0.01 ns / second</option>
          <option value="1e-10">0.1 ns / second</option>
          <option value="1e-9">1 ns / second</option>
          <option value="3e-9">3 ns / second</option>
        </select>
      </label>
      <div class="control-row">
        <label>
          <span id="bMagLabel">Magnetic field |B| 1.0</span>
          <input id="bMag" type="range" min="0" max="10" step="0.1" value="1">
        </label>
        <label>
          <span id="bThetaLabel">Field Î¸ 90Â°</span>
          <input id="bTheta" type="range" min="0" max="180" value="90">
        </label>
        <label>
          <span id="bPhiLabel">Field Ï† 0Â°</span>
          <input id="bPhi" type="range" min="0" max="360" value="0">
        </label>
        <button id="togglePlay">Play</button>
      </div>
    </section>

    <section id="visuals">
      <div id="clocks"></div>
      <div id="three"></div>
    </section>
  </main>

  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
